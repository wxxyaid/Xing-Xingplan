name: Temporary WaterWidget Harmony 5.5 build

on:
  push:
    branches:
      - tmp-waterwidget-harmony-550-build

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout upstream WaterWidget 5.5.0
        uses: actions/checkout@v4
        with:
          repository: nocookies111/life-798
          ref: 86566185aac1138e80c49ff0267d42a18f3452ec

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android SDK packages
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -perm -111 2>/dev/null | sort -V | tail -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found under $ANDROID_HOME"
            find "$ANDROID_HOME" -maxdepth 4 -type f | head -100 || true
            exit 1
          fi
          echo "Using sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-37.0" "build-tools;36.0.0"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/build-tools/36.0.0" >> "$GITHUB_PATH"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Apply HarmonyOS 3 / API26 source compatibility patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          gradle = Path("app/build.gradle.kts")
          s = gradle.read_text()
          assert s.count('minSdk = 33') == 1
          s = s.replace('minSdk = 33', 'minSdk = 26', 1)
          s, n = re.subn(r'^\s*implementation\("top\.yukonga\.miuix\.kmp:miuix-blur-android:0\.9\.3"\)\s*\n', '', s, count=1, flags=re.M)
          assert n == 1, "miuix blur dependency not found exactly once"
          gradle.write_text(s)

          dashboard = Path("src/main/kotlin/com/water/widget/ui/DashboardScreen.kt")
          s = dashboard.read_text()

          # Remove all blur-only imports.
          s, n = re.subn(r'^import top\.yukonga\.miuix\.kmp\.blur\..*\n', '', s, flags=re.M)
          assert n == 6, f"expected 6 blur imports, removed {n}"

          # Remove the remembered backdrop block.
          s, n = re.subn(
              r'\n    val blurBackdrop = rememberLayerBackdrop \{\n'
              r'        drawRect\(colors\.background\)\n'
              r'        drawContent\(\)\n'
              r'    \}\n',
              '\n', s, count=1
          )
          assert n == 1, "rememberLayerBackdrop block not found"

          # Remove the page backdrop modifier, argument, and function parameter.
          assert s.count('.layerBackdrop(blurBackdrop)') == 1
          s = s.replace('                .layerBackdrop(blurBackdrop)\n', '', 1)
          assert s.count('backdrop = blurBackdrop,') == 1
          s = s.replace('            backdrop = blurBackdrop,\n', '', 1)
          assert s.count('backdrop: LayerBackdrop,') == 1
          s = s.replace('    backdrop: LayerBackdrop,\n', '', 1)

          # Remove the full textureBlur(...) call, preserving navigation-bar inset padding.
          s, n = re.subn(
              r'\n            \.textureBlur\(\n'
              r'.*?'
              r'\n            \)\n'
              r'            \.windowInsetsPadding\(WindowInsets\.navigationBars\)',
              '\n            .background(colors.surface)\n'
              '            .windowInsetsPadding(WindowInsets.navigationBars)',
              s, count=1, flags=re.S
          )
          assert n == 1, "textureBlur block not found"

          forbidden = [
              'miuix.kmp.blur',
              'rememberLayerBackdrop',
              '.layerBackdrop(',
              '.textureBlur(',
              'LayerBackdrop',
              'BlurColors',
              'BlendColorEntry',
          ]
          for token in forbidden:
              assert token not in s, f"blur token still present: {token}"
          dashboard.write_text(s)

          # Avoid predictive-back opt-in on the old Android compatibility layer.
          manifest = Path("src/main/AndroidManifest.xml")
          s = manifest.read_text()
          assert s.count('android:enableOnBackInvokedCallback="true"') == 1
          s = s.replace('android:enableOnBackInvokedCallback="true"',
                        'android:enableOnBackInvokedCallback="false"', 1)
          manifest.write_text(s)

          # Build-time placeholders only. User/account tokens are never used here.
          Path("secrets.properties").write_text(
              "API_GATEWAY=https://xx.example.com/api/v1\n" +
              "SIGN_SALT=" + "S"*31 + "\n" +
              "APP_SIGN_SALT=" + "A"*31 + "\n" +
              "MINI_SIGN_SALT=" + "M"*31 + "\n" +
              "API_CID=" + "C"*22 + "\n"
          )
          PY

      - name: Confirm source identity
        run: |
          grep -n 'versionName = "5.5.0"' app/build.gradle.kts
          grep -n 'versionCode = 23' app/build.gradle.kts
          grep -n 'minSdk = 26' app/build.gradle.kts
          ! grep -R "miuix-blur-android" -n app/build.gradle.kts

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace

      - name: Run Android lint
        run: ./gradlew lintDebug --no-daemon --stacktrace

      - name: Build API26 debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Verify APK with Android SDK tools
        shell: bash
        run: |
          apk="app/build/outputs/apk/debug/app-debug.apk"
          test -f "$apk"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$apk" | tee /tmp/apksigner.txt
          "$ANDROID_HOME/build-tools/36.0.0/aapt2" dump badging "$apk" | tee /tmp/badging.txt
          grep "package: name='com.water.widget'" /tmp/badging.txt
          grep "versionCode='23'" /tmp/badging.txt
          grep "versionName='5.5.0'" /tmp/badging.txt
          grep "sdkVersion:'26'" /tmp/badging.txt

      - name: Collect official Android build tools for final local signing audit
        run: |
          mkdir -p compatibility-tools
          cp "$ANDROID_HOME/build-tools/36.0.0/lib/apksigner.jar" compatibility-tools/
          cp "$ANDROID_HOME/build-tools/36.0.0/zipalign" compatibility-tools/
          cp "$ANDROID_HOME/build-tools/36.0.0/aapt2" compatibility-tools/

      - name: Upload compatibility APK and audit inputs
        uses: actions/upload-artifact@v4
        with:
          name: WaterWidget-5.5.0-HarmonyOS3-API26-source-build
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/reports/lint-results-debug.html
            app/build/reports/lint-results-debug.txt
            /tmp/apksigner.txt
            /tmp/badging.txt
            compatibility-tools/**
          if-no-files-found: warn
